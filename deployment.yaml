apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-web-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: my-web-app

  template:
    metadata:
      labels:
        app: my-web-app

    spec:
      containers:
        - name: my-web-container
          image: my-web-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
